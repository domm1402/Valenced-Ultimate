name: Build Domms Games Presence
on:
  workflow_dispatch:
  push:
    paths:
      - "native/domms-games-presence/**"
      - ".github/workflows/build-domms-presence.yml"
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - name: Build Valenced plugin JavaScript
        run: |
          npm install --no-audit --no-fund
          node .github/scripts/generate-plugins.mjs
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37 build-tools;37.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Download Discord Social SDK AAR
        run: |
          mkdir -p native/domms-games-presence/plugin/libs
          curl -fL "https://github.com/tiktoknotificationtroll-wq/Valenced-Ultimate/releases/download/discord-sdk-v1/discord_partner_sdk.aar" -o native/domms-games-presence/plugin/libs/discord_partner_sdk.aar
      - name: Extract SDK classes, headers and ABI libraries
        run: |
          cd native/domms-games-presence/plugin
          mkdir -p src/main/cpp/sdk src/main/jniLibs
          unzip -q libs/discord_partner_sdk.aar -d /tmp/discord-aar
          cp /tmp/discord-aar/libs/discord_partner_sdk.jar libs/discord_partner_sdk.jar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "src/main/cpp/sdk/$abi/include" "src/main/jniLibs/$abi"
            cp /tmp/discord-aar/prefab/modules/discord_partner_sdk/include/discordpp.h "src/main/cpp/sdk/$abi/include/"
            cp "/tmp/discord-aar/jni/$abi/libdiscord_partner_sdk.so" "src/main/cpp/sdk/$abi/"
            cp "/tmp/discord-aar/jni/$abi/libdiscord_partner_sdk.so" "src/main/jniLibs/$abi/"
          done
      - name: Build Android native plugin library
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd native/domms-games-presence
          gradle :plugin:assembleRelease --stacktrace
      - name: Assemble installable Valenced plugin ZIP
        run: |
          set -euxo pipefail
          AAR="native/domms-games-presence/plugin/build/outputs/aar/plugin-release.aar"
          mkdir -p /tmp/domms-aar /tmp/domms-dex dist/domms-games-presence/android dist/domms-games-presence/lib
          unzip -q "$AAR" -d /tmp/domms-aar
          test -f /tmp/domms-aar/classes.jar
          test -f plugins/domms-games-presence/build/js/index.js
          cp plugins/domms-games-presence/manifest.json dist/domms-games-presence/manifest.json
          cp plugins/domms-games-presence/build/js/index.js dist/domms-games-presence/index.js
          "$ANDROID_HOME/build-tools/37.0.0/d8" --lib "$ANDROID_HOME/platforms/android-37/android.jar" --output /tmp/domms-dex /tmp/domms-aar/classes.jar native/domms-games-presence/plugin/libs/discord_partner_sdk.jar
          (cd /tmp/domms-dex && zip -q "$GITHUB_WORKSPACE/dist/domms-games-presence/android/plugin.jar" classes.dex)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "dist/domms-games-presence/lib/$abi"
            cp "/tmp/domms-aar/jni/$abi/libdiscord_partner_sdk.so" "dist/domms-games-presence/lib/$abi/"
            cp "/tmp/domms-aar/jni/$abi/libdomms_presence.so" "dist/domms-games-presence/lib/$abi/"
          done
          (cd dist/domms-games-presence && zip -qr ../domms-games-presence.zip .)
          unzip -l dist/domms-games-presence.zip
      - name: Upload installable plugin and native build
        uses: actions/upload-artifact@v4
        with:
          name: domms-games-presence-installable
          path: |
            dist/domms-games-presence.zip
            native/domms-games-presence/plugin/build/outputs/aar/*.aar
