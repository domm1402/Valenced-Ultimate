name: Build Plugin Studio APK
on:
  workflow_dispatch:
  push:
    paths: ['plugin-studio/**', '.github/workflows/plugin-studio-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: plugin-studio
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: valenced-plugin-studio-apk
          path: plugin-studio/app/build/outputs/apk/debug/app-debug.apk
