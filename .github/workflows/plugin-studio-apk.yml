name: Build Plugin Studio APK
on:
  workflow_dispatch:
  push:
    paths: ['plugin-studio/**', '.github/workflows/plugin-studio-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      # GitHub's Ubuntu runner already includes Android command-line tools.
      # Do not use setup-android here: its default "tools" package is obsolete.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle offline TypeScript compiler
        run: |
          npm install --prefix /tmp/plugin-studio-ts typescript@5.9.3
          mkdir -p plugin-studio/app/src/main/assets
          cp /tmp/plugin-studio-ts/node_modules/typescript/lib/typescript.js plugin-studio/app/src/main/assets/tsc.js
      - name: Build APK
        working-directory: plugin-studio
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: valenced-plugin-studio-apk
          path: plugin-studio/app/build/outputs/apk/debug/app-debug.apk
