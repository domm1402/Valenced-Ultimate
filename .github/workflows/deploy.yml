name: Build and deploy Valenced Ultimate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - name: Include repository homepage in Pages output
        run: cp index.html dist/index.html
      - name: Build Valenced installer ZIP with manifest at root
        run: |
          mkdir -p package-root
          cp dist/valenced-ultimate/index.js package-root/index.js
          cp dist/valenced-ultimate/manifest.json package-root/manifest.json
          cd package-root
          zip -q ../dist/Valenced-Ultimate.zip index.js manifest.json
      - name: Publish compiled plugins to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
