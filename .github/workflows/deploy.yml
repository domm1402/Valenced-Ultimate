name: Build and publish Valenced plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install build tools
        run: npm install
      - name: Generate plugin source folders
        run: node .github/scripts/generate-plugins.mjs
      - name: Build Valenced plugins
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Download and unpack Discord Social SDK
        run: |
          mkdir -p native/domms-games-presence/plugin/libs
          curl -fL "https://github.com/tiktoknotificationtroll-wq/Valenced-Ultimate/releases/download/discord-sdk-v1/discord_partner_sdk.aar" -o native/domms-games-presence/plugin/libs/discord_partner_sdk.aar
          cd native/domms-games-presence/plugin
          mkdir -p src/main/cpp/sdk src/main/jniLibs
          unzip -q libs/discord_partner_sdk.aar -d /tmp/discord-aar
          cp /tmp/discord-aar/libs/discord_partner_sdk.jar libs/discord_partner_sdk.jar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "src/main/cpp/sdk/$abi/include" "src/main/jniLibs/$abi"
            cp /tmp/discord-aar/prefab/modules/discord_partner_sdk/include/discordpp.h "src/main/cpp/sdk/$abi/include/"
            cp /tmp/discord-aar/prefab/modules/discord_partner_sdk/include/cdiscord.h "src/main/cpp/sdk/$abi/include/"
            cp "/tmp/discord-aar/jni/$abi/libdiscord_partner_sdk.so" "src/main/cpp/sdk/$abi/"
            cp "/tmp/discord-aar/jni/$abi/libdiscord_partner_sdk.so" "src/main/jniLibs/$abi/"
          done
      - name: Build Android native plugin
        run: |
          cd native/domms-games-presence
          gradle :plugin:assembleRelease --stacktrace
      - name: Assemble Domms Games Presence native payload
        run: |
          set -euxo pipefail
          AAR="native/domms-games-presence/plugin/build/outputs/aar/plugin-release.aar"
          mkdir -p /tmp/domms-aar /tmp/domms-dex plugins/domms-games-presence/android plugins/domms-games-presence/lib
          unzip -q "$AAR" -d /tmp/domms-aar
          test -f /tmp/domms-aar/classes.jar
          test -f plugins/domms-games-presence/build/js/index.js
          cp /tmp/domms-aar/classes.jar /tmp/domms-classes.jar
          zip -d /tmp/domms-classes.jar app/valenced/plugins/PluginBuilder.class app/valenced/plugins/PluginBuilderKt.class app/valenced/plugins/PluginScope.class app/valenced/xposed/api/HostScope.class app/valenced/xposed/api/HostScopeKt.class
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/domms-dex /tmp/domms-classes.jar native/domms-games-presence/plugin/libs/discord_partner_sdk.jar
          cp /tmp/domms-dex/classes.dex plugins/domms-games-presence/android/plugin.jar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "plugins/domms-games-presence/lib/$abi"
            cp "/tmp/domms-aar/jni/$abi/libdiscord_partner_sdk.so" "plugins/domms-games-presence/lib/$abi/"
            cp "/tmp/domms-aar/jni/$abi/libdomms_presence.so" "plugins/domms-games-presence/lib/$abi/"
          done
      - name: Package plugin ZIPs
        run: node .github/scripts/package-plugins.mjs
      - name: Generate repository index
        run: npm run generate-index -- --dist dist/pool --base-url https://tiktoknotificationtroll-wq.github.io/Valenced-Ultimate/pool --out dist/index.json
      - name: Copy landing page
        run: cp index.html dist/index.html
      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
