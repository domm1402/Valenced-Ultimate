name: Build and publish Valenced plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install build tools
        run: npm install
      - name: Generate plugin source folders
        run: node .github/scripts/generate-plugins.mjs
      - name: Apply safe Domms Games Presence implementation
        run: node .github/scripts/fix-domms-presence.mjs
      - name: Build Valenced plugins
        run: npm run build
      - name: Package plugin ZIPs
        run: node .github/scripts/package-plugins.mjs
      - name: Generate repository index
        run: npm run generate-index -- --dist dist/pool --base-url https://tiktoknotificationtroll-wq.github.io/Valenced-Ultimate/pool --out dist/index.json
      - name: Copy landing page
        run: cp index.html dist/index.html
      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
